<!doctype html>
<!-- Source for apple-touch-icon.png (180x180). Render at 180x180 and screenshot. -->
<html lang="en"><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 180px; height: 180px; overflow: hidden; }
  .icon {
    width: 180px; height: 180px; position: relative;
    background: radial-gradient(ellipse at center, #1a0d2e 0%, #0a0514 60%, #050208 100%);
  }
  .planet {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 40% 36%, #e8d4ff 0%, #b478ff 38%, #ff3cb4 78%, #3a1060 100%);
    box-shadow: 0 0 28px rgba(180,120,255,0.55);
  }
  .ring {
    position: absolute; top: 50%; left: 50%;
    width: 150px; height: 52px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    transform: translate(-50%, -50%) rotate(-20deg);
  }
  .s { position: absolute; border-radius: 50%; background: #fff; }
  .s1 { width: 5px; height: 5px; top: 34px; right: 38px; }
  .s2 { width: 3px; height: 3px; top: 50px; left: 36px; opacity: 0.8; }
  .s3 { width: 3px; height: 3px; bottom: 40px; left: 52px; opacity: 0.7; }
</style></head>
<body><div class="icon">
  <div class="planet"></div><div class="ring"></div>
  <span class="s s1"></span><span class="s s2"></span><span class="s s3"></span>
</div></body></html>
