<!doctype html>
<!-- Source for og.png (1200x630). Regenerate: render this at 1200x630 and screenshot to og.png. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background: radial-gradient(ellipse at center, #12091f 0%, #0a0514 42%, #050208 78%, #000 100%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .stars {
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 120px 90px, rgba(255,255,255,0.9), transparent 40%),
        radial-gradient(1px 1px at 300px 200px, rgba(255,255,255,0.6), transparent 40%),
        radial-gradient(1px 1px at 520px 120px, rgba(255,255,255,0.7), transparent 40%),
        radial-gradient(2px 2px at 760px 80px, rgba(255,255,255,0.8), transparent 40%),
        radial-gradient(1px 1px at 980px 180px, rgba(255,255,255,0.5), transparent 40%),
        radial-gradient(1.5px 1.5px at 1080px 460px, rgba(255,255,255,0.8), transparent 40%),
        radial-gradient(1px 1px at 200px 520px, rgba(255,255,255,0.6), transparent 40%),
        radial-gradient(1px 1px at 640px 560px, rgba(255,255,255,0.7), transparent 40%),
        radial-gradient(1px 1px at 900px 540px, rgba(255,255,255,0.5), transparent 40%);
    }
    .nebula {
      position: absolute; top: 50%; left: 50%;
      width: 1000px; height: 760px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse 60% 42% at 50% 50%,
        rgba(180,120,255,0.42) 0%, rgba(255,80,180,0.2) 40%, transparent 70%);
      filter: blur(28px);
    }
    .ring {
      position: absolute; top: 50%; left: 50%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      transform: translate(-50%, -50%);
    }
    .ring.r1 { width: 520px; height: 520px; border-color: rgba(180,120,255,0.18); }
    .ring.r2 { width: 760px; height: 760px; border-color: rgba(255,100,200,0.12); }
    .ring.r3 { width: 1010px; height: 1010px; border-style: dashed; border-color: rgba(255,255,255,0.07); }
    .content { position: relative; text-align: center; z-index: 2; }
    .wordmark {
      font-weight: 300;
      font-size: 132px;
      line-height: 1;
      letter-spacing: 0.03em;
    }
    .wordmark em { font-style: italic; font-weight: 400; color: #e8d4ff; }
    .tagline {
      margin-top: 26px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 22px;
      letter-spacing: 9px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .platforms {
      margin-top: 40px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(232,212,255,0.7);
    }
    .dot { color: rgba(255,255,255,0.3); margin: 0 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="stars"></div>
    <div class="nebula"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="content">
      <div class="wordmark">Chris <em>Gwim</em></div>
      <div class="tagline">Music Producer</div>
      <div class="platforms">Spotify<span class="dot">·</span>Apple Music<span class="dot">·</span>SoundCloud<span class="dot">·</span>YouTube<span class="dot">·</span>Deezer</div>
    </div>
  </div>
</body>
</html>
